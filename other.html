<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Other - Cian McCarroll</title>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png" type="image/png">
  <script src="theme.js"></script>
  <style>
    .projects-container {
      max-width: 400px;
      margin: 3rem auto;
      text-align: center;
    }

    .project-item {
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      transition: box-shadow 0.4s ease, transform 0.3s ease, border-color 0.3s ease;
    }

    .project-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(164, 144, 255, 0.25), 0 0 60px rgba(164, 144, 255, 0.1);
    }

    .soundcloud-link {
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--accent) !important;
      letter-spacing: 0.02em;
    }

    .soundcloud-link:hover {
      color: var(--heading) !important;
    }

    .now-playing {
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text-secondary);
      margin-top: 0.8rem;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      letter-spacing: 0.02em;
    }

    .now-playing.visible {
      opacity: 0.7;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="toggle-switch">
    <input type="checkbox" id="color-mode" class="toggle-checkbox">
    <label for="color-mode" class="toggle-label"></label>
  </div>
  <div class="visitor-counter"><span id="visitor-count"></span></div>

  <div class="page-content">
    <nav>
      <a href="index.html">home</a>
      <a href="research.html">research</a>
      <a href="literature-map.html">literature galaxy</a>
      <a href="contact.html">contact</a>
      <a href="other.html">other</a>
    </nav>

    <h1>Other</h1>

    <div class="projects-container">
      <div class="project-item" id="soundcloud-card">
        <a href="https://soundcloud.com/frmrhnd" target="_blank" class="soundcloud-link">SoundCloud</a>
        <div class="now-playing" id="now-playing">♫ Gold Chain My Neck</div>
      </div>
    </div>
  </div>

  <!-- Hidden SoundCloud Widget -->
  <iframe id="sc-widget" style="display:none" allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Ffrmrhnd%2Fgold-chain-my-neck&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false">
  </iframe>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var iframe = document.getElementById('sc-widget');
      var widget = SC.Widget(iframe);
      var card = document.getElementById('soundcloud-card');
      var nowPlaying = document.getElementById('now-playing');
      var isReady = false;

      widget.bind(SC.Widget.Events.READY, function() {
        isReady = true;
        widget.setVolume(50);
      });

      card.addEventListener('mouseenter', function() {
        if (isReady) {
          widget.play();
          nowPlaying.classList.add('visible');
        }
      });

      card.addEventListener('mouseleave', function() {
        if (isReady) {
          widget.pause();
          nowPlaying.classList.remove('visible');
        }
      });
    });
  </script>
</body>
</html>

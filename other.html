  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Spectral', serif;
      line-height: 1.6;
      color: #f5f5f5;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
      background-color: #2a2a2a;
    }

    h1, h2, h3 {
      font-family: 'Spectral', serif;
      font-weight: 500;
      margin: 1.5rem 0 1rem 0;
      color: #ffffff;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-top: 2rem;
      text-align: center;
    }
    
    h2 {
      font-size: 1.8rem;
      margin-top: 2.5rem;
      border-bottom: 1px solid #a490ff;
      padding-bottom: 0.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    
    h3 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }
    
    p {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      font-weight: 300;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid #a490ff;
      margin-bottom: 1.5rem;
    }
    
    nav a {
      text-decoration: none;
      color: #cccccc;
      margin: 0 1.5rem;
      font-size: 1.1rem;
      transition: color 0.2s ease;
    }
    
    nav a:hover {
      color: #ffffff;
      border-bottom: 2px solid #a490ff;
    }
    
    /* Projects container */
    .projects-container {
      max-width: 600px;
      margin: 3rem auto;
      text-align: center;
    }

    .project-item {
      margin-bottom: 3rem;
      padding: 2rem;
      border-radius: 8px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background-color: rgba(164, 144, 255, 0.05);
    }

    .project-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(164, 144, 255, 0.15);
    }

    .project-item a {
      color: #f5f5f5;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .project-item a:hover {
      color: #a490ff;
    }

    /* Track widgets */
    .tracks-container {
      max-width: 680px;
      margin: 2rem auto;
    }

    .track-widget {
      margin-bottom: 1.5rem;
    }

    .track-widget iframe {
      border-radius: 6px;
      display: block;
    }

    /* Responsive styles */
    @media (max-width: 768px) {
      body {
        padding: 0 15px;
      }

      nav a {
        margin: 0 0.8rem;
        font-size: 1rem;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<!DOCTYPE html>

<head>

  <script src="theme.js"></script>
  <style>
    .contact-list {
      max-width: 400px;
      margin: 3rem auto;
      text-align: center;
    }

    .contact-item {
      margin: 1.2rem 0;
      padding: 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      transition: box-shadow 0.4s ease, transform 0.3s ease, border-color 0.3s ease;
    }

    .contact-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(164, 144, 255, 0.25), 0 0 60px rgba(164, 144, 255, 0.1);
    }

    .contact-item a {
      font-size: 1.1rem;
      font-weight: 300;
      display: block;
    }
  </style>
</head>
<body>
  <div class="toggle-switch">
    <input type="checkbox" id="color-mode" class="toggle-checkbox">
    <label for="color-mode" class="toggle-label"></label>
  </div>

      </div>

        <a href="https://www.linkedin.com/in/cianmccarroll" target="_blank">LinkedIn</a>
      </div>
    </div>
  </div>
</body>

<style>

<script>
// ─── THEMES ─────────────────────────────────────────────────────────
const themes = {
  "Urban AI":       { color: "#4ecdc4", cx: 0.22, cy: 0.35, r: 0.23 },
  "Time & Speed":   { color: "#ff6b6b", cx: 0.55, cy: 0.25, r: 0.24 },
  "Surveillance":   { color: "#ffd93d", cx: 0.80, cy: 0.45, r: 0.20 },
  "Urban Space":    { color: "#6c5ce7", cx: 0.30, cy: 0.72, r: 0.22 },
  "Autonomy":       { color: "#a8e6cf", cx: 0.58, cy: 0.68, r: 0.20 }
};

// Anchor authors — one per theme, placed at dead centre
const anchors = {
  "Urban AI": "cugurullo",
  "Time & Speed": "rosa",
  "Surveillance": "zuboff",
  "Urban Space": "lefebvre",  // Harvey also central but offset slightly
  "Autonomy": "berardi"
};

// ─── AUTHORS ────────────────────────────────────────────────────────
const authors = [
  // ══════ FOUNDATIONAL ══════════════════════════════════════════════
  // — Urban AI —
  { id:"cugurullo", author:"Federico Cugurullo", title:"Frankenstein Urbanism / AI and the City / AIdeology", year:"2021–2026", tier:"foundational", anchor:true, themes:["Urban AI"],
    notes:"Cugurullo's body of work anchors AI urbanism. Frankenstein Urbanism (2021) examines how smart cities are assembled from contradictory logics. AI and the City (2023, edited) explores how AI alters urban governance across 18 chapters. AIdeology (2026) argues AI functions as both technology and ideology, identifying three myths: AI will save the planet, AI is becoming human, and AI will end work." },
  { id:"kitchin", author:"Rob Kitchin", title:"Code/Space / Data-Driven Urbanism", year:"2011–2017", tier:"foundational", themes:["Urban AI","Surveillance"],
    notes:"Foundational work theorising how software and code produce and mediate space. Code/Space (with Dodge) introduces concepts of code/space and coded space. Data-driven urbanism analyses how urban data systems serve both state and corporate interests." },
  { id:"graham-marvin", author:"Stephen Graham & Simon Marvin", title:"Splintering Urbanism", year:2001, tier:"foundational", themes:["Urban AI","Urban Space"],
    notes:"How networked infrastructures fragment urban space, creating 'premium networked spaces' alongside bypassed zones of disconnection and exclusion. Foundational for understanding the spatial politics of digital infrastructure." },
  { id:"crawford", author:"Kate Crawford", title:"Atlas of AI", year:2021, tier:"foundational", themes:["Urban AI","Surveillance"],
    notes:"Maps AI's material infrastructure from lithium mines to data centres, revealing the planetary costs, exploitative labour, and concentrated power behind artificial intelligence systems." },
  { id:"greenfield", author:"Adam Greenfield", title:"Against the Smart City", year:2013, tier:"foundational", themes:["Urban AI"],
    notes:"Critical pamphlet unpacking smart city rhetoric, challenging corporate visions of blank-slate projects like New Songdo, Masdar City, and PlanIT Valley." },
  { id:"mattern", author:"Shannon Mattern", title:"A City Is Not a Computer", year:2021, tier:"foundational", themes:["Urban AI","Urban Space"],
    notes:"Argues against reducing cities to computational systems, advocating for recognition of diverse forms of urban intelligence beyond the digital and algorithmic." },
  { id:"levitt", author:"Deborah Levitt", title:"The Animatic Apparatus", year:2018, tier:"foundational", themes:["Urban AI","Time & Speed"],
    notes:"Theorises the convergence of animation, simulation, and digital media as a new regime of perception and urban experience, connecting machinic world-production to liveness and temporal manipulation." },

  // — Time & Speed —
  { id:"rosa", author:"Hartmut Rosa", title:"Social Acceleration / Resonance", year:"2013–2019", tier:"foundational", anchor:true, themes:["Time & Speed"],
    notes:"Foundational theory identifying three interlocking forms of acceleration — technological, social change, and pace of life — producing totalitarianism through temporal norms. Resonance (2019) develops a counterpoint: responsive relationships with the world as essential to flourishing." },
  { id:"hagerstrand", author:"Torsten Hägerstrand", title:"Time-Geography", year:1970, tier:"foundational", themes:["Time & Speed","Urban Space"],
    notes:"Seminal work introducing time-geographic concepts of paths, prisms, and constraints. 'What about people in regional science?' questioned the field's neglect of individual human subjects in space-time." },
  { id:"virilio", author:"Paul Virilio", title:"Speed and Politics", year:2006, tier:"foundational", themes:["Time & Speed"],
    notes:"Foundational text in dromology (the study of speed), arguing that political power is fundamentally about control over speed and that military logistics drives urban and technological development." },
  { id:"crary", author:"Jonathan Crary", title:"24/7: Late Capitalism and the Ends of Sleep", year:2013, tier:"foundational", themes:["Time & Speed","Surveillance"],
    notes:"Argues that 24/7 capitalism erodes sleep as the last barrier to total market colonisation of human time, framing sleep as a site of resistance against non-stop productivity." },
  { id:"wajcman", author:"Judy Wajcman", title:"Pressed for Time / The Sociology of Speed", year:"2014–2017", tier:"foundational", themes:["Time & Speed","Autonomy"],
    notes:"Challenges technological determinism in accounts of time pressure, showing how digital technologies are socially shaped and that the experience of acceleration varies by gender, class, and occupation." },
  { id:"thompson", author:"E.P. Thompson", title:"Time, Work-Discipline, and Industrial Capitalism", year:1967, tier:"foundational", themes:["Time & Speed","Autonomy"],
    notes:"Classic historical analysis of how industrial capitalism transformed temporal consciousness, replacing task-oriented time with clock-discipline and establishing the temporal foundations of modern work." },

  // — Surveillance —
  { id:"zuboff", author:"Shoshana Zuboff", title:"The Age of Surveillance Capitalism", year:2019, tier:"foundational", anchor:true, themes:["Surveillance"],
    notes:"Names and anatomises surveillance capitalism — a new economic logic extracting and commodifying behavioural data to predict and modify human behaviour at scale. Essential for understanding the political economy of urban AI." },
  { id:"han", author:"Byung-Chul Han", title:"Psychopolitics", year:2017, tier:"foundational", themes:["Time & Speed","Surveillance"],
    notes:"Argues neoliberal power operates through psychic self-exploitation. The 'achievement subject' internalises productivity demands, making surveillance feel like freedom. A bridge between temporal experience and digital control." },
  { id:"pasquale", author:"Frank Pasquale", title:"The Black Box Society", year:2015, tier:"foundational", themes:["Surveillance"],
    notes:"Analyses the opacity of algorithmic decision-making in finance and search, arguing that 'black box' systems undermine accountability and democratic oversight." },
  { id:"noble", author:"Safiya Umoja Noble", title:"Algorithms of Oppression", year:2018, tier:"foundational", themes:["Surveillance","Autonomy"],
    notes:"Demonstrates how search engine algorithms reproduce and amplify racial and gender biases, arguing that commercial AI systems perpetuate structural discrimination." },

  // — Urban Space —
  { id:"lefebvre", author:"Henri Lefebvre", title:"Rhythmanalysis / The Production of Space", year:"1974–1992", tier:"foundational", anchor:true, themes:["Urban Space","Time & Speed"],
    notes:"Rhythmanalysis provides a method for reading the temporal textures of everyday urban life. The spatial triad (spatial practice, representations of space, representational spaces) offers a unified framework for thinking space-time politically." },
  { id:"harvey", author:"David Harvey", title:"The Condition of Postmodernity / Between Space and Time", year:"1989–1990", tier:"foundational", anchor:true, themes:["Urban Space","Time & Speed"],
    notes:"Introduces 'time-space compression' as a concept for understanding how capitalism accelerates and collapses spatial distances. Between Space and Time interrogates the social production of space-time under capitalism." },
  { id:"brenner", author:"Neil Brenner", title:"New Urban Spaces", year:2004, tier:"foundational", themes:["Urban Space"],
    notes:"Theory of state spatial restructuring and rescaling — the political-economic backbone for understanding how urban space is produced through governance, capital, and territorial strategy." },
  { id:"soja", author:"Edward Soja", title:"Postmodern Geographies / Seeking Spatial Justice", year:"1989–2010", tier:"foundational", themes:["Urban Space"],
    notes:"Reassertion of space in critical social theory — the 'socio-spatial dialectic.' Seeking Spatial Justice argues geography matters fundamentally for justice and that urban structures produce and are produced by inequalities." },
  { id:"massey", author:"Doreen Massey", title:"For Space", year:2005, tier:"foundational", themes:["Urban Space","Autonomy"],
    notes:"Reconceptualises space as the product of interrelations, as the sphere of multiplicity, and as always under construction — challenging static and bounded conceptions of place." },
  { id:"castells", author:"Manuel Castells", title:"The Rise of the Network Society", year:1996, tier:"foundational", themes:["Urban Space","Time & Speed"],
    notes:"Foundational text on the information age, theorising the 'space of flows' and 'timeless time' as new spatial and temporal logics of network society that restructure urban hierarchies." },
  { id:"urry", author:"John Urry", title:"Mobilities", year:2007, tier:"foundational", themes:["Time & Speed","Urban Space"],
    notes:"Foundational text establishing the 'mobilities paradigm,' arguing that social science must place movement — of people, objects, information, and images — at its analytical centre." },

  // — Autonomy —
  { id:"berardi", author:"Franco 'Bifo' Berardi", title:"Futurability", year:2017, tier:"foundational", anchor:true, themes:["Autonomy","Time & Speed"],
    notes:"Explores possibility, potency, and power in semiocapitalism. Reclaiming the future requires a new relationship to time, affect, and collective imagination beyond the exhaustion of accelerated life." },
  { id:"arendt", author:"Hannah Arendt", title:"The Human Condition", year:1958, tier:"foundational", themes:["Autonomy","Urban Space"],
    notes:"Distinctions between labour, work, and action ground a political theory of human agency. The 'public realm' — the space of appearance where freedom is enacted — is foundational for thinking autonomy in urban contexts." },
  { id:"srnicek", author:"Nick Srnicek", title:"Platform Capitalism", year:2016, tier:"foundational", themes:["Autonomy","Surveillance"],
    notes:"Theorises platforms as a new business model of digital capitalism, classifying advertising, cloud, industrial, product, and lean platforms as extractive economic forms." },
  { id:"latour", author:"Bruno Latour", title:"Reassembling the Social", year:2005, tier:"foundational", themes:["Urban AI","Autonomy"],
    notes:"Foundational ANT text redefining sociology as the study of associations between human and nonhuman actors, arguing against reductive explanations that invoke 'the social' as an explanatory force." },

  // ══════ INTERLOCUTORS ═════════════════════════════════════════════
  // — Urban AI orbit —
  { id:"caprotti", author:"Federico Caprotti", title:"Urban AI in China / Platform Urbanism", year:2022, tier:"interlocutor", field:"Human Geography", themes:["Urban AI","Urban Space"],
    notes:"Examines whether urban AI in China represents state social control or hyper-capitalist development. Analyses Alibaba's City Brain as relational co-production between state and corporate actors.", orbitParentId:"cugurullo" },
  { id:"marvin", author:"Simon Marvin", title:"Splintering Urbanism at 20", year:2022, tier:"interlocutor", field:"Urban Geography", themes:["Urban AI","Urban Space"],
    notes:"Retrospective on the Splintering Urbanism thesis, mapping how the 'infrastructural turn' has extended and complicated the original arguments.", orbitParentId:"graham-marvin" },
  { id:"guo", author:"Zongtian Guo", title:"Digital Governance", year:null, tier:"interlocutor", field:"Digital Governance", themes:["Urban AI","Surveillance"],
    notes:"Research on digital governance examining how algorithmic systems reshape state-citizen relations and the politics of data-driven urban decision making.", orbitParentId:"kitchin" },
  { id:"bei-chen", author:"Bei Chen", title:"Platform Urbanism", year:null, tier:"interlocutor", field:"Platform Urbanism", themes:["Urban AI","Time & Speed"],
    notes:"Investigates how digital platforms restructure urban space, labour, and everyday life — the interplay between algorithmic management and temporal organisation of platform work.", orbitParentId:"cugurullo" },
  { id:"coletta", author:"Claudio Coletta", title:"Algorhythmic Governance", year:2017, tier:"interlocutor", field:"Digital Geography", themes:["Urban AI","Time & Speed"],
    notes:"Introduces 'algorhythmic governance' — how IoT systems regulate the temporal rhythms of city life. Uses Dublin's traffic management as case study. With Rob Kitchin.", orbitParentId:"kitchin" },
  { id:"shelton", author:"Taylor Shelton", title:"The Actually Existing Smart City", year:2015, tier:"interlocutor", field:"Urban Geography", themes:["Urban AI","Urban Space"],
    notes:"Adapts Brenner and Theodore's 'actually existing neoliberalism' framework to smart cities, grounding analysis in Louisville and Philadelphia.", orbitParentId:"greenfield" },
  { id:"sadowski", author:"Jathan Sadowski", title:"Too Smart / Who Owns the Future City?", year:2020, tier:"interlocutor", field:"Digital Political Economy", themes:["Urban AI","Surveillance"],
    notes:"Critical analysis of how digital capitalism extracts data from everyday life. Traces phases of technological urbanism from cybernetics to platform capitalism.", orbitParentId:"crawford" },

// ─── LAYOUT ─────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight, minD = Math.min(W, H);
const themeCircles = Object.entries(themes).map(([name, t]) => ({
  name, color: t.color, cx: t.cx*W, cy: t.cy*H, r: t.r*minD
}));

function srand(seed) { let x = Math.sin(seed)*10000; return x - Math.floor(x); }

const foundational = authors.filter(a => a.tier === "foundational");
const interlocutors = authors.filter(a => a.tier === "interlocutor");

// Place anchor authors at dead-centre of their primary theme
const anchorIds = Object.values(anchors);
const groups = {};
foundational.forEach(a => { const k = a.themes.join("+"); if (!groups[k]) groups[k]=[]; groups[k].push(a); });

foundational.forEach((a, i) => {
  const rel = themeCircles.filter(c => a.themes.includes(c.name));
  let cx = rel.reduce((s,c)=>s+c.cx,0)/rel.length;
  let cy = rel.reduce((s,c)=>s+c.cy,0)/rel.length;

  // Anchors go to dead centre of their primary theme
  if (a.anchor) {
    const primary = themeCircles.find(c => c.name === a.themes[0]);
    // Harvey shares Urban Space anchor with Lefebvre — offset slightly
    if (a.id === "harvey") {
      a.x = primary.cx + 45;
      a.y = primary.cy - 25;
    } else {
      a.x = primary.cx;
      a.y = primary.cy;
    }
    return;
  }

  // Non-anchors spread within their theme region
  const grp = groups[a.themes.join("+")];
  const idx = grp.indexOf(a), cnt = grp.length;
  if (cnt <= 1) {
    a.x = cx + (srand(i*7+1)-0.5)*60;
    a.y = cy + (srand(i*13+3)-0.5)*60;
  } else {
    const ang = (idx/cnt)*Math.PI*2 + srand(i*3)*0.5;
    const spr = 40 + cnt*12;
    a.x = cx + Math.cos(ang)*spr;
    a.y = cy + Math.sin(ang)*spr;
  }
});

// Configure interlocutor orbits
interlocutors.forEach((a, i) => {
  const parent = authors.find(f => f.id === a.orbitParentId);
  if (!parent) return;
  a.orbitParent = parent;

  const shared = a.themes.filter(t => parent.themes.includes(t)).length;
  const total = a.themes.length;
  a.orbitRadius = 55 + (total - shared)*28 + srand(i*31)*22;
  a.orbitSpeed = 0.10 + srand(i*41)*0.20;
  if (srand(i*53) > 0.5) a.orbitSpeed *= -1;

  const other = a.themes.filter(t => !parent.themes.includes(t));
  if (other.length > 0) {
    const oc = themeCircles.filter(c => other.includes(c.name));
    a.pullX = (oc.reduce((s,c)=>s+c.cx,0)/oc.length - parent.x) * 0.3;
    a.pullY = (oc.reduce((s,c)=>s+c.cy,0)/oc.length - parent.y) * 0.3;
  } else { a.pullX = 0; a.pullY = 0; }

  a.tilt = Math.atan2(a.pullY, a.pullX);
  a.angle = srand(i*67) * Math.PI * 2;
  a.x = parent.x; a.y = parent.y;
});

// ─── RENDER ─────────────────────────────────────────────────────────
const svg = d3.select("#map-svg"), g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.25,4]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// Theme circles
const circGrp = g.append("g");
circGrp.selectAll("circle").data(themeCircles).join("circle")
  .attr("cx",d=>d.cx).attr("cy",d=>d.cy).attr("r",d=>d.r)
  .attr("fill",d=>d.color).attr("fill-opacity",0.03)
  .attr("stroke",d=>d.color).attr("stroke-opacity",0.10).attr("stroke-width",1);

circGrp.selectAll("text").data(themeCircles).join("text")
  .attr("x",d=>d.cx).attr("y",d=>d.cy-d.r+22)
  .attr("text-anchor","middle").attr("fill",d=>d.color).attr("fill-opacity",0.28)
  .attr("font-size","11px").attr("font-family","'Space Grotesk',sans-serif")
  .attr("font-weight",500).attr("letter-spacing","1.5px")
  .text(d=>d.name.toUpperCase());

// Foundational connections
const conns = [];
for (let i=0;i<foundational.length;i++) for (let j=i+1;j<foundational.length;j++) {
  const sh = foundational[i].themes.filter(t=>foundational[j].themes.includes(t));
  if (sh.length) conns.push({source:foundational[i],target:foundational[j],shared:sh,strength:sh.length});
}

const linkGrp = g.append("g");
linkGrp.selectAll("line.conn").data(conns).join("line").attr("class","conn")
  .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
  .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y)
  .attr("stroke","#fff").attr("stroke-opacity",d=>0.015+d.strength*0.015)
  .attr("stroke-width",d=>0.3+d.strength*0.3);

// Orbit trail ellipses — dotted lines
const trailGrp = g.append("g");
const trailEllipses = {};

interlocutors.forEach((a, i) => {
  if (!a.orbitParent) return;
  const p = a.orbitParent;
  const rx = a.orbitRadius;
  const pull = Math.sqrt(a.pullX*a.pullX + a.pullY*a.pullY);
  const ry = rx * Math.max(0.45, 1 - pull/(rx*3));
  const deg = a.tilt*180/Math.PI;
  const el = trailGrp.append("ellipse")
    .attr("cx",p.x+a.pullX*0.5).attr("cy",p.y+a.pullY*0.5)
    .attr("rx",rx).attr("ry",ry)
    .attr("transform",`rotate(${deg},${p.x+a.pullX*0.5},${p.y+a.pullY*0.5})`)
    .attr("fill","none").attr("stroke",themes[a.themes[0]].color)
    .attr("stroke-opacity",0.06).attr("stroke-width",0.7)
    .attr("stroke-dasharray","3,8");
  trailEllipses[a.id] = el;
});

// Tether lines
const tetherLines = linkGrp.selectAll("line.tether").data(interlocutors.filter(a=>a.orbitParent)).join("line")
  .attr("class","tether").attr("stroke",d=>themes[d.themes[0]].color)
  .attr("stroke-opacity",0.05).attr("stroke-width",0.4);

// Nodes
const nodeGrp = g.append("g");
const allA = [...foundational, ...interlocutors];

const nodes = nodeGrp.selectAll("g.node").data(allA,d=>d.id).join("g")
  .attr("class",d=>`node t-${d.tier}`)
  .attr("transform",d=>`translate(${d.x},${d.y})`)
  .style("cursor","pointer")
  .on("click",(e,d)=>{ e.stopPropagation(); openPanel(d); highlightNode(d); })
  .on("mouseenter",(e,d)=>{
    const c=d.tier==="foundational";
    d3.select(e.currentTarget).select(".glow").transition().duration(200).attr("r",c?28:18).attr("fill-opacity",c?0.22:0.16);
    d3.select(e.currentTarget).select(".core").transition().duration(200).attr("r",c?10:6);
    // Brighten orbit trail
    if (trailEllipses[d.id]) trailEllipses[d.id].transition().duration(200).attr("stroke-opacity",0.25).attr("stroke-width",1.2);
    // If foundational, brighten all children orbits
    if (d.tier==="foundational") {
      interlocutors.filter(a=>a.orbitParent&&a.orbitParent.id===d.id).forEach(a=>{
        if(trailEllipses[a.id]) trailEllipses[a.id].transition().duration(200).attr("stroke-opacity",0.18).attr("stroke-width",1);
      });
    }
  })
  .on("mouseleave",(e,d)=>{
    const c=d.tier==="foundational";
    d3.select(e.currentTarget).select(".glow").transition().duration(300).attr("r",c?24:14).attr("fill-opacity",c?0.10:0.06);
    d3.select(e.currentTarget).select(".core").transition().duration(300).attr("r",c?8:4);
    if (trailEllipses[d.id]) trailEllipses[d.id].transition().duration(300).attr("stroke-opacity",0.06).attr("stroke-width",0.7);
    if (d.tier==="foundational") {
      interlocutors.filter(a=>a.orbitParent&&a.orbitParent.id===d.id).forEach(a=>{
        if(trailEllipses[a.id]) trailEllipses[a.id].transition().duration(300).attr("stroke-opacity",0.06).attr("stroke-width",0.7);
      });
    }
  });

// Anchor pulse ring
nodes.filter(d=>d.anchor).append("circle").attr("class","anchor-pulse")
  .attr("fill",d=>themes[d.themes[0]].color)
  .attr("fill-opacity",0.08).attr("r",12)
  .style("animation","anchorPulse 3s ease-in-out infinite");

// Glow
nodes.append("circle").attr("class","glow")
  .attr("r",d=>d.tier==="foundational"?24:14)
  .attr("fill",d=>themes[d.themes[0]].color)
  .attr("fill-opacity",d=>d.tier==="foundational"?0.10:0.06);

// Core
nodes.append("circle").attr("class","core")
  .attr("r",d=>d.tier==="foundational"?8:4)
  .attr("fill",d=>themes[d.themes[0]].color)
  .attr("fill-opacity",d=>d.tier==="foundational"?0.95:0.7);

// Multi-theme rings
nodes.filter(d=>d.themes.length>1&&d.tier==="foundational").append("circle")
  .attr("r",13).attr("fill","none").attr("stroke",d=>themes[d.themes[1]].color)
  .attr("stroke-opacity",0.4).attr("stroke-width",1.5).attr("stroke-dasharray","3,3");

nodes.filter(d=>d.themes.length>1&&d.tier==="interlocutor").append("circle")
  .attr("r",8).attr("fill","none").attr("stroke",d=>themes[d.themes[1]].color)
  .attr("stroke-opacity",0.3).attr("stroke-width",1).attr("stroke-dasharray","2,3");

// Labels — first author surname only
nodes.append("text").attr("dy",d=>d.tier==="foundational"?28:20)
  .attr("text-anchor","middle")
  .attr("fill","#fff").attr("fill-opacity",d=>d.tier==="foundational"?0.80:0.42)
  .attr("font-size",d=>d.tier==="foundational"?"11px":"9px")
  .attr("font-family","'Inter',sans-serif")
  .attr("font-weight",d=>d.tier==="foundational"?500:300)
  .text(d => {
    // Always use the first author's surname
    const firstAuthor = d.author.split(/\s*[&,]\s*/)[0].trim();
    const parts = firstAuthor.split(" ");
    return parts[parts.length - 1];
  });

// ─── ORBITAL ANIMATION ──────────────────────────────────────────────
let animOn = true, lt = performance.now();

function tick(now) {
  if (animOn) {
    const dt = Math.min((now-lt)/1000, 0.1);
    interlocutors.forEach(a => {
      if (!a.orbitParent) return;
      const p = a.orbitParent;
      a.angle += a.orbitSpeed * dt;
      const rx = a.orbitRadius;
      const pull = Math.sqrt(a.pullX*a.pullX+a.pullY*a.pullY);
      const ry = rx * Math.max(0.45, 1 - pull/(rx*3));
      const ct=Math.cos(a.tilt),st=Math.sin(a.tilt);
      const ca=Math.cos(a.angle),sa=Math.sin(a.angle);
      const lx=rx*ca, ly=ry*sa;
      a.x = p.x + a.pullX*0.5 + lx*ct - ly*st;
      a.y = p.y + a.pullY*0.5 + lx*st + ly*ct;
    });
    nodes.filter(d=>d.tier==="interlocutor").attr("transform",d=>`translate(${d.x},${d.y})`);
    tetherLines.attr("x1",d=>d.x).attr("y1",d=>d.y).attr("x2",d=>d.orbitParent.x).attr("y2",d=>d.orbitParent.y);
  }
  lt = now;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function toggleAnimation() {
  animOn = !animOn; lt = performance.now();
  document.getElementById("pause-btn").textContent = animOn ? "Pause orbits" : "Resume orbits";
}

// ─── PANEL ──────────────────────────────────────────────────────────
let activeNode = null;

function openPanel(d) {
  activeNode = d;
  const panel = document.getElementById("detail-panel");
  const content = document.getElementById("panel-content");
  const tags = d.themes.map(t=>`<span class="theme-tag" style="background:${themes[t].color}22;color:${themes[t].color};border:1px solid ${themes[t].color}44;">${t}</span>`).join("");
  const tier = d.tier==="foundational"
    ? (d.anchor ? '<div class="tier-tag foundational">Anchor Text</div>' : '<div class="tier-tag foundational">Foundational Text</div>')
    : '<div class="tier-tag">Interlocutor</div>';
  const field = d.field?`<div class="field-tag">${d.field}</div>`:'';
  const yr = d.year?` (${d.year})`:'';

  const related = authors.filter(a=>a.id!==d.id&&a.themes.some(t=>d.themes.includes(t)));
  related.sort((a,b)=>{ if(a.tier!==b.tier) return a.tier==="foundational"?-1:1; return b.themes.filter(t=>d.themes.includes(t)).length - a.themes.filter(t=>d.themes.includes(t)).length; });

  const connList = related.slice(0,15).map(a=>{
    const badge = a.tier==="interlocutor"?'<span class="conn-tier">interlocutor</span>':'';
    const t = a.year?`${a.title} (${a.year})`:a.field||a.title;
    return `<div class="connection-item" onclick="navigateTo('${a.id}')">${a.author} — <em>${t}</em>${badge}</div>`;
  }).join("");

  content.innerHTML = `${tags}<br/>${tier}<div class="author-name">${d.author}</div>${field}<div class="work-title">${d.title}${yr}</div><div class="notes">${d.notes}</div><div class="connections"><h3>Connected works</h3>${connList}</div>`;
  panel.classList.add("open");
}

function closePanel() {
  document.getElementById("detail-panel").classList.remove("open");
  activeNode = null;
  nodes.transition().duration(300).attr("opacity",1);
  linkGrp.selectAll("line.conn").transition().duration(300).attr("stroke-opacity",d=>0.015+d.strength*0.015);
  tetherLines.transition().duration(300).attr("stroke-opacity",0.05);
  Object.values(trailEllipses).forEach(el=>el.transition().duration(300).attr("stroke-opacity",0.06).attr("stroke-width",0.7));
}

function highlightNode(d) {
  const rel = new Set([d.id]);
  conns.forEach(c=>{ if(c.source.id===d.id) rel.add(c.target.id); if(c.target.id===d.id) rel.add(c.source.id); });
  if (d.orbitParent) rel.add(d.orbitParent.id);
  interlocutors.forEach(a=>{ if(a.orbitParent&&a.orbitParent.id===d.id) rel.add(a.id); });

  nodes.transition().duration(300).attr("opacity",a=>rel.has(a.id)?1:0.08);
  linkGrp.selectAll("line.conn").transition().duration(300).attr("stroke-opacity",l=>(l.source.id===d.id||l.target.id===d.id)?0.35:0.003);
  tetherLines.transition().duration(300).attr("stroke-opacity",l=>(l.id===d.id||(l.orbitParent&&l.orbitParent.id===d.id))?0.3:0.008);

  // Highlight orbit trails for this node and children
  Object.entries(trailEllipses).forEach(([id, el]) => {
    if (id === d.id || interlocutors.find(a=>a.id===id&&a.orbitParent&&a.orbitParent.id===d.id)) {
      el.transition().duration(300).attr("stroke-opacity",0.22).attr("stroke-width",1);
    } else {
      el.transition().duration(300).attr("stroke-opacity",0.015).attr("stroke-width",0.4);
    }
  });
}

function navigateTo(id) {
  const a = authors.find(x=>x.id===id);
  if (!a) return;
  openPanel(a); highlightNode(a);
  svg.transition().duration(750).call(zoom.transform,
    d3.zoomIdentity.translate(W/2,H/2).scale(1.8).translate(-a.x,-a.y));
}

svg.on("click",()=>closePanel());

// ─── LEGEND ─────────────────────────────────────────────────────────
const legEl = document.getElementById("legend");
let activeFilt = null;

Object.entries(themes).forEach(([name,t])=>{
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-dot" style="background:${t.color}"></div>${name}`;
  item.addEventListener("click",()=>{
    if (activeFilt===name) {
      activeFilt=null;
      document.querySelectorAll(".legend-item").forEach(el=>el.classList.remove("dimmed"));
      nodes.transition().duration(300).attr("opacity",1);
      circGrp.selectAll("circle").transition().duration(300).attr("fill-opacity",0.03).attr("stroke-opacity",0.10);
      linkGrp.selectAll("line.conn").transition().duration(300).attr("stroke-opacity",d=>0.015+d.strength*0.015);
      tetherLines.transition().duration(300).attr("stroke-opacity",0.05);
      Object.values(trailEllipses).forEach(el=>el.transition().duration(300).attr("stroke-opacity",0.06).attr("stroke-width",0.7));
    } else {
      activeFilt=name;
      document.querySelectorAll(".legend-item").forEach(el=>el.classList.toggle("dimmed",!el.textContent.includes(name)));
      nodes.transition().duration(300).attr("opacity",d=>d.themes.includes(name)?1:0.05);
      circGrp.selectAll("circle").transition().duration(300).attr("fill-opacity",d=>d.name===name?0.07:0.01).attr("stroke-opacity",d=>d.name===name?0.25:0.03);
      linkGrp.selectAll("line.conn").transition().duration(300).attr("stroke-opacity",d=>d.shared.includes(name)?0.2:0.002);
      tetherLines.transition().duration(300).attr("stroke-opacity",d=>d.themes.includes(name)?0.15:0.008);
      Object.entries(trailEllipses).forEach(([id, el])=>{
        const a = authors.find(x=>x.id===id);
        el.transition().duration(300)
          .attr("stroke-opacity",a&&a.themes.includes(name)?0.15:0.01)
          .attr("stroke-width",a&&a.themes.includes(name)?0.9:0.3);
      });
    }
  });
  legEl.appendChild(item);
});

// ─── ENTRANCE ───────────────────────────────────────────────────────
circGrp.selectAll("circle").attr("fill-opacity",0).attr("stroke-opacity",0).transition().delay((_,i)=>i*100).duration(800).attr("fill-opacity",0.03).attr("stroke-opacity",0.10);
circGrp.selectAll("text").attr("fill-opacity",0).transition().delay((_,i)=>i*100+200).duration(600).attr("fill-opacity",0.28);
nodes.attr("opacity",0).transition().delay((d,i)=>d.anchor?i*50:d.tier==="foundational"?300+i*50:900+i*35).duration(500).attr("opacity",1);
linkGrp.selectAll("line").attr("stroke-opacity",0).transition().delay(1200).duration(600).attr("stroke-opacity",function(d){ return d.strength!==undefined?0.015+d.strength*0.015:0.05; });
trailGrp.selectAll("ellipse").attr("stroke-opacity",0).transition().delay(1400).duration(600).attr("stroke-opacity",0.06);

// ─── THEME TOGGLE ──────────────────────────────────────────────────
(function() {
  const html = document.documentElement;
  const cb = document.getElementById('galaxy-color-mode');
  if (!cb) return;
  cb.checked = html.classList.contains('light');

  function applyTheme() {
    const isLight = html.classList.contains('light');
    const labelColor = isLight ? '#222' : '#fff';
    const labelOpacity = isLight ? 0.55 : 0.28;
    const circleFill = isLight ? 0.06 : 0.03;
    const circleStroke = isLight ? 0.18 : 0.10;
    const connBaseOpacity = isLight ? 0.04 : 0.015;
    const connStrengthMult = isLight ? 0.04 : 0.015;
    const tetherOpacity = isLight ? 0.10 : 0.05;
    const trailOpacity = isLight ? 0.12 : 0.06;
    const foundLabelOpacity = isLight ? 0.90 : 0.80;
    const intLabelOpacity = isLight ? 0.60 : 0.42;

    // Theme circle labels
    circGrp.selectAll("text")
      .transition().duration(400)
      .attr("fill-opacity", labelOpacity);

    // Theme circles
    circGrp.selectAll("circle")
      .transition().duration(400)
      .attr("fill-opacity", circleFill)
      .attr("stroke-opacity", circleStroke);

    // Node labels
    nodes.selectAll("text")
      .transition().duration(400)
      .attr("fill", labelColor)
      .attr("fill-opacity", d => d.tier === "foundational" ? foundLabelOpacity : intLabelOpacity);

    // Connection lines
    linkGrp.selectAll("line.conn")
      .transition().duration(400)
      .attr("stroke", isLight ? '#000' : '#fff')
      .attr("stroke-opacity", d => connBaseOpacity + d.strength * connStrengthMult);

    // Tether lines
    tetherLines.transition().duration(400).attr("stroke-opacity", tetherOpacity);

    // Trail ellipses
    trailGrp.selectAll("ellipse").transition().duration(400).attr("stroke-opacity", trailOpacity);
  }

  cb.addEventListener('change', function() {
    html.classList.toggle('light', this.checked);
    localStorage.setItem('theme', this.checked ? 'light' : 'dark');
    applyTheme();
  });

  // Apply on load if light
  if (html.classList.contains('light')) {
    setTimeout(applyTheme, 1800); // after entrance animations
  }
})();
</script>
